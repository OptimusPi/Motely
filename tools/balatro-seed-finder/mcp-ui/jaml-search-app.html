<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JAML Search — Balatro</title>
    <style>
      :root {
        font-family: system-ui, -apple-system, sans-serif;
        /* JimboUI color-picked palette (JimboUI.axaml) */
        --bg: #1e2b2d;
        --bg2: #1a2332;
        --bg3: #2a3233;
        --panel: #374244;
        --border: #334461;
        --border2: #4f6367;
        --text: #f6f0d5;
        --text2: #a0a8b8;
        --text3: #708386;
        --red: #ff4c40;
        --red-dark: #a02721;
        --blue: #0093ff;
        --blue-dark: #0057a1;
        --gold: #ffc640;
        --gold-text: #e4b643;
        --orange: #ff9800;
        --green: #429f79;
        --green-text: #35bd86;
        --purple: #525db0;
        --accent: #935adc;
        --grey-dark: #3a5055;

        color: var(--text);
        background: var(--bg);
      }
      body {
        margin: 0;
        padding: 12px;
      }
      table.seed-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.82rem;
      }
      table.seed-table th {
        text-align: left;
        padding: 6px 8px;
        border-bottom: 2px solid var(--border);
        color: var(--text3);
        font-weight: 600;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      table.seed-table td {
        padding: 5px 8px;
        border-bottom: 1px solid var(--grey-dark);
      }
      table.seed-table tr:hover td {
        background: var(--bg3);
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
