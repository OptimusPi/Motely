<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>JAML – New UI</title>
  <link rel="stylesheet" href="jaml.css?v=3" />
  <link rel="stylesheet" data-name="vs/editor/editor.main" href="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/editor/editor.main.css">
</head>
<body>
  <div class="app-layout">
    <!-- Header Removed per user request -->

    <div class="side-by-side panel-shell">
      <div class="left-panel">
        <div class="tabs">
          <button class="tab active" onclick="switchTab('search', this)">
             JAML Filter
          </button>
          <button class="tab" onclick="switchTab('analyze', this)">
             Analyzer
          </button>
        </div>

        <div id="search-tab" class="tab-content active">
          <!-- Row 1: Dropdowns Side-by-Side -->
          <div class="dropdown-row">
            <div class="input-group" style="flex:1">
              <select id="filtersDropdown"></select>
            </div>
            <div class="input-group" style="flex:1">
              <select id="seedSourceDropdown"></select>
            </div>
          </div>

          <!-- Row 2: Editor Controls & Settings -->
          <div class="editor-header">
            <div class="editor-toggle-group">
              <button onclick="setEditorMode('monaco')" id="monacoBtn" class="toggle-btn active">Monaco Editor</button>
              <button onclick="setEditorMode('plain')" id="plainBtn" class="toggle-btn">Plain Text</button>
            </div>
            
            <div class="editor-buttons">
              <button onclick="formatJaml()" class="button-small" title="Format Code">Format</button>
              <button onclick="saveFilter()" class="button-small" title="Save Filter">Save</button>
              <button id="settingsBtn" onclick="openSettings()" class="button-small" title="Manage Filter">Settings</button>
            </div>
          </div>

          <!-- Row 3: Editor -->
          <div id="monacoEditor" class="monaco-container"></div>
          <textarea id="filterJaml" class="plain-editor" style="display:none"></textarea>
          
          <!-- Start Search Button moved to Results Header -->
        </div>

        <div id="analyze-tab" class="tab-content">
          <div class="info-text">Click a seed in Results to analyze</div>
          <div id="analyzeContainer" class="analyze-container"></div>
        </div>
      </div>

      <div id="panelSplitter" class="panel-splitter" role="separator" aria-orientation="vertical" tabindex="0"></div>

      <div class="right-panel">
        <div class="results-header">
          <div class="results-header-top">
            <div class="results-actions-left">
              <button id="searchBtn" onclick="toggleSearch()" class="button-primary">Start Search</button>
              <button onclick="shareLink()" class="icon-btn" title="Share Link">🔗</button>
              <button onclick="toggleColorMode()" class="icon-btn" title="Toggle Color Mode">🎨</button>
            </div>
            
            <div class="results-actions-right">
              <button onclick="exportCsv()" class="icon-btn" title="Export CSV" style="background: var(--balatro-blue)">CSV 💾</button>
              <button onclick="stopAll()" class="button-small button-danger">Stop All</button>
            </div>
          </div>
          <div id="status"></div>
        </div>
        
        <div id="resultsGrid" class="results-container">
          <div class="no-results">
            <p>No results yet</p>
            <p class="help-text">Start a search to see results</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Settings Modal (Simplified) -->
    <div id="settingsModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle" onclick="handleBackdrop(event)">
      <div class="modal-content" onclick="event.stopPropagation()">
        <div class="modal-header">
          <h3 id="settingsTitle">Manage Filter</h3>
          <button class="close-btn" aria-label="Close" onclick="closeSettings()">&times;</button>
        </div>
        <div class="modal-body">
          <p class="help-text">Actions apply to the currently selected filter.</p>
          <div class="action-grid">
             <button class="button-action blue" onclick="renameFilter()">
               <span class="icon" aria-hidden="true">✎</span> Rename
             </button>
             <button class="button-action orange" onclick="cloneFilter()">
               <span class="icon" aria-hidden="true">⎘</span> Clone
             </button>
             <button class="button-action red" onclick="deleteFilter()">
               <span class="icon" aria-hidden="true">🗑</span> Delete
             </button>
          </div>
        </div>
        <div class="modal-footer">
          <button class="button-small" onclick="closeSettings()">Close</button>
        </div>
      </div>
    </div>

    <!-- Generic Input Modal -->
    <div id="inputModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="inputModalTitle" onclick="handleBackdrop(event)">
      <div class="modal-content" onclick="event.stopPropagation()">
        <div class="modal-header">
          <h3 id="inputModalTitle">Input</h3>
          <button class="close-btn" aria-label="Close" onclick="closeInputModal()">&times;</button>
        </div>
        <div class="modal-body">
          <p id="inputModalMessage" class="help-text" style="display:none"></p>
          <div class="input-group">
            <input type="text" id="inputModalValue" class="modal-input" placeholder="Enter value..." aria-invalid="false" onkeydown="handleInputKey(event)" oninput="clearInputError()">
            <span id="inputErrorMsg" class="error-text" style="display:none; color: var(--balatro-red); font-size: 0.85rem; margin-top: 4px;"></span>
          </div>
        </div>
        <div class="modal-footer">
          <button class="button-small" onclick="closeInputModal()">Cancel</button>
          <button id="inputModalConfirm" class="button-primary">Confirm</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
  <script src="jaml.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
  <script>
    require.config({ paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs' } });
    require(['vs/editor/editor.main'], function () {
      const container = document.getElementById('monacoEditor');
      const initialValue = document.getElementById('filterJaml')?.value || '';
      window.jamlEditor = monaco.editor.create(container, {
        value: initialValue,
        language: 'yaml',
        automaticLayout: true,
        theme: 'vs-dark',
        minimap: { enabled: false },
        fontSize: 18,
        fontFamily: "'Consolas', 'Cascadia Code', 'JetBrains Mono', monospace", /* Soft Normie Monospace */
        lineNumbers: 'on',
        scrollBeyondLastLine: false,
        padding: { top: 10, bottom: 10 }
      });
      window.jamlEditor.addCommand(monaco.KeyMod.Shift | monaco.KeyCode.Tab, () => {
        window.jamlEditor.trigger('keyboard', 'editor.action.outdentLines');
      });
      window.jamlEditor.onDidChangeModelContent(() => {
        document.getElementById('filterJaml').value = window.jamlEditor.getValue();
      });
      if (typeof window.onMonacoReady === 'function') window.onMonacoReady();
    });
  </script>
</body>
</html>
