<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=5.0, user-scalable=yes" />
  <title>Motely Search - Preact</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@latest/dist/browser/signalr.min.js"></script>
  <script type="module">
    import { h, render } from "https://esm.sh/preact@10.19.3";
    import { useState, useEffect, useRef } from "https://esm.sh/preact@10.19.3/hooks";
    import htm from "https://esm.sh/htm@3.1.1";
    const html = htm.bind(h);

    function App() {
      const [filterJaml, setFilterJaml] = useState("");
      const [seedSource, setSeedSource] = useState("all");
      const [seedCount, setSeedCount] = useState("");
      const [seedSources, setSeedSources] = useState([]);
      const [currentSearchId, setCurrentSearchId] = useState(null);
      const [searchStatus, setSearchStatus] = useState(null);
      const [isSearching, setIsSearching] = useState(false);
      const [results, setResults] = useState([]);
      const [columns, setColumns] = useState(["seed", "score"]);
      const [progressPercent, setProgressPercent] = useState(0);
      const [seedsSearched, setSeedsSearched] = useState(0);
      const [seedsPerSecond, setSeedsPerSecond] = useState(0);
      const [lastError, setLastError] = useState(null);
      const [connectionState, setConnectionState] = useState("Disconnected");
      const [splitPos, setSplitPos] = useState(() => parseFloat(localStorage.getItem("splitPositionPreact") || "50"));

      const pollRef = useRef(null);
      const connRef = useRef(null);
      const resizing = useRef(false);
      const startPos = useRef(0);
      const containerSize = useRef(0);

      useEffect(() => {
        fetch("/seed-sources").then(r => r.json()).then(data => {
          setSeedSources(data || []);
          if (data && data.length && !seedSource) setSeedSource(data[0].key || "all");
        }).catch(console.error);

        fetch("/searches/active").then(r => r.json()).then(data => {
          if (data.searches && data.searches.length > 0) {
            setCurrentSearchId(data.searches[0].id);
            loadStatus(data.searches[0].id);
          }
        }).catch(console.error);
      }, []);

      useEffect(() => {
        if (pollRef.current) clearInterval(pollRef.current);
        pollRef.current = setInterval(() => {
          if (currentSearchId) loadStatus(currentSearchId);
        }, 2000);
        return () => clearInterval(pollRef.current);
      }, [currentSearchId]);

      useEffect(() => {
        if (!window.signalR || !window.signalR.HubConnectionBuilder) return;
        const conn = new window.signalR.HubConnectionBuilder().withUrl("/searchHub").withAutomaticReconnect().build();
        connRef.current = conn;
        conn.on("Result", (data) => {
          try {
            const payload = typeof data === "string" ? JSON.parse(data) : data;
            if (payload.searchId !== currentSearchId) return;
            if (payload.results && Array.isArray(payload.results)) {
              setResults(prev => {
                const seeds = new Set(prev.map(r => r.seed));
                const merged = [...prev];
                payload.results.forEach(r => { if (!seeds.has(r.seed)) merged.push(r); });
                return merged.sort((a, b) => (b.score || 0) - (a.score || 0));
              });
            }
            if (payload.columns) setColumns(payload.columns);
            if (payload.progressPercent !== undefined) setProgressPercent(payload.progressPercent);
            if (payload.seedsSearched !== undefined) setSeedsSearched(payload.seedsSearched);
            if (payload.seedsPerSecond !== undefined) setSeedsPerSecond(payload.seedsPerSecond);
          } catch (err) { console.error(err); }
        });
        conn.start().then(() => {
          setConnectionState("Connected");
          if (currentSearchId) conn.invoke("JoinSearchGroup", currentSearchId).catch(console.error);
        }).catch(err => console.error(err));
        conn.onreconnected(() => {
          setConnectionState("Connected");
          if (currentSearchId) conn.invoke("JoinSearchGroup", currentSearchId).catch(console.error);
        });
        conn.onclose(() => setConnectionState("Disconnected"));
        return () => { conn.stop().catch(() => {}); };
      }, [currentSearchId]);

      useEffect(() => {
        applySplit();
      }, [splitPos]);

      const applySplit = () => {
        const left = document.querySelector(".left-panel");
        const right = document.querySelector(".right-panel");
        if (!left || !right) return;
        const isMobile = window.innerWidth <= 768;
        left.style.flex = `0 0 ${splitPos}%`;
        right.style.flex = `1 1 ${100 - splitPos}%`;
      };

      const startResize = (e) => {
        e.preventDefault();
        const container = document.querySelector(".split-container");
        const isMobile = window.innerWidth <= 768;
        resizing.current = true;
        if (isMobile) {
          startPos.current = e.type === "mousedown" ? e.clientY : e.touches[0].clientY;
          containerSize.current = container.offsetHeight;
        } else {
          startPos.current = e.type === "mousedown" ? e.clientX : e.touches[0].clientX;
          containerSize.current = container.offsetWidth;
        }
      };

      useEffect(() => {
        const move = (e) => {
          if (!resizing.current) return;
          e.preventDefault();
          const isMobile = window.innerWidth <= 768;
          let currentPos, delta, pct;
          if (isMobile) {
            currentPos = e.type === "mousemove" ? e.clientY : e.touches[0].clientY;
            delta = startPos.current - currentPos;
            pct = (delta / containerSize.current) * 100;
          } else {
            currentPos = e.type === "mousemove" ? e.clientX : e.touches[0].clientX;
            delta = currentPos - startPos.current;
            pct = (delta / containerSize.current) * 100;
          }
          setSplitPos(prev => {
            const next = Math.max(30, Math.min(70, prev + pct));
            localStorage.setItem("splitPositionPreact", next.toString());
            return next;
          });
          startPos.current = currentPos;
        };
        const up = () => { resizing.current = false; };
        document.addEventListener("mousemove", move);
        document.addEventListener("mouseup", up);
        document.addEventListener("touchmove", move, { passive: false });
        document.addEventListener("touchend", up);
        return () => {
          document.removeEventListener("mousemove", move);
          document.removeEventListener("mouseup", up);
          document.removeEventListener("touchmove", move);
          document.removeEventListener("touchend", up);
        };
      }, []);

      const loadStatus = async (id) => {
        if (!id) return;
        try {
          const res = await fetch(`/search?id=${encodeURIComponent(id)}`);
          if (!res.ok) return;
          const data = await res.json();
          setSearchStatus(data.status || data.searchStatus || "stopped");
          setIsSearching((data.status || data.searchStatus) === "running");
          if (data.progressPercent !== undefined) setProgressPercent(data.progressPercent);
          if (data.seedsSearched !== undefined) setSeedsSearched(data.seedsSearched);
          if (data.seedsPerSecond !== undefined) setSeedsPerSecond(data.seedsPerSecond);
          setLastError(data.lastError || null);
          if (data.results && Array.isArray(data.results)) {
            setResults(prev => {
              const seeds = new Set(prev.map(r => r.seed));
              const merged = [...prev];
              data.results.forEach(r => { if (!seeds.has(r.seed)) merged.push(r); });
              return merged.sort((a, b) => (b.score || 0) - (a.score || 0));
            });
          }
          if (data.columns) setColumns(data.columns);
          if (data.filterJaml && !filterJaml) setFilterJaml(data.filterJaml);
        } catch (err) { console.error(err); }
      };

      const startSearch = async () => {
        if (!filterJaml.trim()) { alert("Please enter a JAML filter"); return; }
        try {
          setIsSearching(true);
          setLastError(null);
          const res = await fetch("/search", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              filterJaml: filterJaml.trim(),
              seedSource: seedSource || "all",
              seedCount: seedCount || null
            })
          });
          if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            throw new Error(err.error || "Failed to start search");
          }
          const data = await res.json();
          setCurrentSearchId(data.searchId);
          setSearchStatus("running");
          setProgressPercent(data.progressPercent || 0);
          setResults((data.results || []).sort((a, b) => (b.score || 0) - (a.score || 0)));
          if (data.columns) setColumns(data.columns);
          await loadStatus(data.searchId);
        } catch (err) {
          setLastError(err.message);
          setIsSearching(false);
          alert("Error starting search: " + err.message);
        }
      };

      const stopSearch = async () => {
        if (!currentSearchId) return;
        try {
          const res = await fetch(`/search/${encodeURIComponent(currentSearchId)}/panic-stop`, { method: "POST" });
          if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            throw new Error(err.error || "Failed to stop search");
          }
          setIsSearching(false);
          setSearchStatus("stopped");
          await loadStatus(currentSearchId);
        } catch (err) {
          setLastError(err.message);
          alert("Error stopping search: " + err.message);
        }
      };

      const clearResults = () => {
        if (confirm("Clear all results?")) {
          setResults([]);
          setProgressPercent(0);
          setSeedsSearched(0);
          setSeedsPerSecond(0);
        }
      };

      const exportCsv = () => {
        if (!results.length) { alert("No results to export"); return; }
        const headers = columns.join(",");
        const rows = results.map(r => {
          const vals = [];
          vals.push(`\"${r.seed || ""}\"`);
          vals.push(r.score || 0);
          if (r.tallies && Array.isArray(r.tallies)) r.tallies.forEach(t => vals.push(t));
          return vals.join(",");
        });
        const csv = [headers, ...rows].join("\\n");
        const blob = new Blob([csv], { type: "text/csv" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `motely-results-${Date.now()}.csv`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      };

      const fmt = (n) => (n === null || n === undefined) ? "0" : n.toLocaleString();

      return html`
        <div class="app-layout">
          <div class="top-bar">
            <h1>Motely Search (Preact)</h1>
            <div class="top-bar-actions">
              <span class="status-indicator" title=${connectionState}>${connectionState === "Connected" ? "🟢" : "🔴"}</span>
            </div>
          </div>

          <div class="split-container">
            <div class="left-panel">
              <div class="panel-header">
                <span class="panel-tab panel-tab-red">JAML Filter</span>
              </div>
              <div class="panel-content">
                <textarea
                  class="jaml-editor"
                  placeholder="Enter your JAML filter configuration..."
                  value=${filterJaml}
                  onInput=${e => setFilterJaml(e.target.value)}
                  spellCheck="false"
                ></textarea>

                <div class="controls-section">
                  <div class="control-row">
                    <label>Seed Source:</label>
                    <select class="control-select" value=${seedSource} onChange=${e => setSeedSource(e.target.value)}>
                      ${(seedSources || []).map(s => html`<option key=${s.key} value=${s.key}>${s.label || s.displayName || s.key}</option>`)}
                    </select>
                  </div>
                  <div class="control-row">
                    <label>Max Seeds:</label>
                    <input
                      type="number"
                      class="control-input"
                      placeholder="All"
                      min="0"
                      value=${seedCount}
                      onInput=${e => setSeedCount(e.target.value)}
                    />
                  </div>
                </div>

                <div class="button-row">
                  <button class="btn btn-primary" disabled=${isSearching || !filterJaml.trim()} onClick=${startSearch}>
                    ${isSearching ? "⏸ Searching..." : "▶ Start"}
                  </button>
                  <button class="btn btn-danger" disabled=${!currentSearchId} onClick=${stopSearch}>
                    ⏹ Stop
                  </button>
                </div>

                ${currentSearchId && html`
                  <div class="status-section">
                    <div class="status-row"><span class="status-label">Status:</span><span class=${"status-value " + (searchStatus === "running" ? "status-running" : "")}>${searchStatus || "Idle"}</span></div>
                    <div class="status-row"><span class="status-label">Progress:</span><span class="status-value">${progressPercent.toFixed(1)}%</span></div>
                    <div class="status-row"><span class="status-label">Searched:</span><span class="status-value">${fmt(seedsSearched)}</span></div>
                    <div class="status-row"><span class="status-label">Found:</span><span class="status-value">${fmt(results.length)}</span></div>
                    <div class="status-row"><span class="status-label">Speed:</span><span class="status-value">${seedsPerSecond > 0 ? fmt(seedsPerSecond) + "/s" : "-"}</span></div>
                    ${lastError && html`<div class="error-box"><strong>Error:</strong> ${lastError}</div>`}
                  </div>
                `}
              </div>
            </div>

            <div
              class="splitter"
              role="separator"
              aria-orientation="vertical"
              onMouseDown=${startResize}
              onTouchStart=${startResize}
            >
              <div class="splitter-handle"></div>
            </div>

            <div class="right-panel">
              <div class="panel-header">
                <span class="panel-tab panel-tab-purple">Results <span class="badge">${results.length}</span></span>
                <div class="panel-actions">
                  <button class="btn-small" disabled=${!results.length} onClick=${clearResults}>🗑️ Clear</button>
                  <button class="btn-small" disabled=${!results.length} onClick=${exportCsv}>📥 Export</button>
                </div>
              </div>
              <div class="panel-content">
                ${!results.length && html`<div class="empty-state">No results yet. Start a search to see results here.</div>`}
                ${results.length > 0 && html`
                  <div class="table-wrapper">
                    <table class="results-table">
                      <thead>
                        <tr>
                          <th>#</th>
                          ${columns.map((c, idx) => html`<th key=${idx}>${c}</th>`)}
                        </tr>
                      </thead>
                      <tbody>
                        ${results.map((r, idx) => html`
                          <tr key=${r.seed || idx}>
                            <td class="row-number">${idx + 1}</td>
                            ${columns.map((c, colIdx) => html`
                              <td class=${c === "seed" ? "seed-cell" : c === "score" ? "score-cell" : ""}>
                                ${c === "seed" ? html`<code>${r.seed}</code>` :
                                  c === "score" ? (r.score || 0) :
                                  ((r.tallies && r.tallies[colIdx - 2] !== undefined) ? r.tallies[colIdx - 2] : "-")}
                              </td>
                            `)}
                          </tr>
                        `)}
                      </tbody>
                    </table>
                  </div>
                `}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    render(h(App), document.body);
  </script>
</head>
<body></body>
</html>
