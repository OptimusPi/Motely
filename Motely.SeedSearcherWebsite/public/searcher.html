<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Motely Searcher</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overscroll-behavior: none; }
  body { font: 13px/1.4 ui-monospace, 'Cascadia Code', 'Fira Code', monospace; background: #0d0d12; color: #ccc; display: flex; flex-direction: column; }
  .bar { display: flex; align-items: center; justify-content: space-between; padding: 6px 12px; background: #111118; border-bottom: 1px solid #1e1e2e; font-size: 11px; color: #555; }
  .bar a { color: #555; text-decoration: none; }
  .bar a:hover { color: #4ade80; }
  .bar .ver { color: #4ade80; }
  .editor { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  textarea { flex: 1; width: 100%; background: #0d0d12; color: #e0e0e0; border: none; padding: 12px; font: inherit; resize: none; outline: none; tab-size: 2; }
  .controls { display: flex; gap: 8px; padding: 8px 12px; background: #111118; border-top: 1px solid #1e1e2e; align-items: center; }
  .controls label { color: #555; font-size: 11px; }
  .controls input { width: 50px; background: #16161e; color: #ccc; border: 1px solid #2a2a38; border-radius: 3px; padding: 3px 6px; font: inherit; font-size: 11px; text-align: center; }
  .controls input:focus { border-color: #4ade80; outline: none; }
  button { padding: 6px 16px; border: none; border-radius: 4px; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; }
  .btn-go { background: #4ade80; color: #0d0d12; }
  .btn-go:hover { background: #22c55e; }
  .btn-go:disabled { background: #1e1e2e; color: #555; cursor: not-allowed; }
  .btn-stop { background: #ef4444; color: #fff; }
  .spacer { flex: 1; }
  #status { font-size: 11px; color: #888; }
  #status .g { color: #4ade80; }
  #status .r { color: #ef4444; }
  .results { max-height: 40vh; overflow-y: auto; border-top: 1px solid #1e1e2e; }
  .results table { width: 100%; border-collapse: collapse; }
  .results td { padding: 4px 12px; font-size: 12px; color: #4ade80; cursor: pointer; border-bottom: 1px solid #111118; }
  .results td:hover { background: #16161e; }
  .results .score { color: #555; float: right; }
  .empty { display: none; }
</style>
</head>
<body>
  <div class="bar">
    <span>motely <span class="ver" id="ver">...</span></span>
    <a href="/">home</a>
  </div>

  <div class="editor">
    <textarea id="jaml" spellcheck="false" placeholder="# Type your JAML filter here...">name: Quick Search
deck: Red
stake: White
must:
  - joker: Blueprint
    antes: [1, 2, 3]</textarea>
  </div>

  <div class="controls">
    <label>threads</label><input id="threads" type="number" value="4" min="1" max="16">
    <label>batch</label><input id="batch" type="number" value="1" min="1" max="5">
    <label>start</label><input id="start" type="number" value="0" min="0">
    <label>end</label><input id="end" type="number" value="35" min="1">
    <span class="spacer"></span>
    <span id="status"></span>
    <button class="btn-go" id="btnGo" disabled>booting...</button>
    <button class="btn-stop" id="btnStop" style="display:none">stop</button>
  </div>

  <div class="results empty" id="resultBox">
    <table><tbody id="seeds"></tbody></table>
  </div>

<script type="module">
  const $ = id => document.getElementById(id);
  const status = $('status');
  const btnGo = $('btnGo');
  const btnStop = $('btnStop');
  const seeds = $('seeds');
  const resultBox = $('resultBox');

  let api = null;
  let searching = false;

  // Boot
  if (!window.isSecureContext) {
    status.innerHTML = '<span class="r">needs https</span>';
  } else {
    try {
      const mod = await import('/motely-framework/index.mjs');
      await (mod.boot ?? mod.default?.boot)();
      api = mod.MotelyWasm ?? mod.Motely?.MotelyWasm ?? mod.Motely?.Executors?.MotelyWasm;
      if (!api) throw new Error('MotelyWasm namespace not found');
      $('ver').textContent = api.getVersion?.() ?? '?';
      btnGo.textContent = 'search';
      btnGo.disabled = false;
      status.innerHTML = '<span class="g">ready</span>';
    } catch (e) {
      status.innerHTML = `<span class="r">${e.message}</span>`;
    }
  }

  // Search
  btnGo.onclick = async () => {
    if (!api || searching) return;
    const jaml = $('jaml').value;
    const err = api.validateJaml?.(jaml);
    if (err) { status.innerHTML = `<span class="r">${err}</span>`; return; }

    searching = true;
    btnGo.style.display = 'none';
    btnStop.style.display = '';
    seeds.innerHTML = '';
    resultBox.classList.remove('empty');

    const onResult = (seed, score) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${seed}${score > 0 ? `<span class="score">+${score}</span>` : ''}</td>`;
      tr.onclick = () => navigator.clipboard.writeText(seed);
      seeds.appendChild(tr);
      resultBox.scrollTop = resultBox.scrollHeight;
    };

    const onProgress = (searched, found, elapsed) => {
      status.innerHTML = `<span class="g">${Number(searched).toLocaleString()}</span> searched · <span class="g">${Number(found)}</span> found · ${(Number(elapsed) / 1000).toFixed(1)}s`;
    };

    api.onResult?.subscribe?.(onResult);
    api.onProgress?.subscribe?.(onProgress);

    try {
      await api.runSearch(
        jaml,
        parseInt($('threads').value) || 4,
        parseInt($('batch').value) || 1,
        parseInt($('start').value) || 0,
        parseInt($('end').value) || 35
      );
      const count = seeds.children.length;
      status.innerHTML = `<span class="g">done</span> · ${count} seed${count !== 1 ? 's' : ''}`;
    } catch (e) {
      status.innerHTML = `<span class="r">${e.message}</span>`;
    }

    api.onResult?.unsubscribe?.(onResult);
    api.onProgress?.unsubscribe?.(onProgress);
    searching = false;
    btnGo.style.display = '';
    btnStop.style.display = 'none';
  };

  btnStop.onclick = () => {
    searching = false;
    btnGo.style.display = '';
    btnStop.style.display = 'none';
    status.innerHTML = 'cancelled';
  };
</script>
</body>
</html>
