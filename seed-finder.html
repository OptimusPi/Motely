<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seed Finder</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Courier New', monospace;
            background: #0d0d12;
            color: #e0e0e0;
            padding: 20px;
            line-height: 1.6;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { color: #00ff88; margin-bottom: 20px; font-size: 24px; }
        label { display: block; margin-top: 15px; font-weight: bold; color: #00ff88; }
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            background: #1a1a1f;
            border: 1px solid #333;
            color: #e0e0e0;
            font-family: inherit;
            font-size: 14px;
            min-height: 200px;
            resize: vertical;
        }
        button {
            background: #00ff88;
            color: #0d0d12;
            border: none;
            padding: 12px 24px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            font-size: 16px;
        }
        button:hover { background: #00cc6a; }
        button:disabled { background: #333; color: #666; cursor: not-allowed; }
        #status {
            margin-top: 20px;
            padding: 15px;
            background: #1a1a1f;
            border: 1px solid #333;
            border-radius: 4px;
        }
        .error { color: #ff4444; }
        .success { color: #00ff88; }
        table {
            width: 100%;
            margin-top: 30px;
            border-collapse: collapse;
            background: #1a1a1f;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #333;
        }
        th {
            background: #0d0d12;
            color: #00ff88;
            font-weight: bold;
        }
        tr:hover { background: #222; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎰 Seed Finder</h1>

        <label for="jaml">JAML Filter</label>
        <textarea id="jaml" placeholder="Paste your JAML filter here..."></textarea>

        <button id="searchBtn" onclick="handleSearch()">Search</button>

        <div id="status">
            <p>Ready. Paste JAML and click Search.</p>
        </div>

        <table id="resultsTable" style="display:none;">
            <thead>
                <tr>
                    <th>Seed</th>
                    <th>Score</th>
                </tr>
            </thead>
            <tbody id="resultsBody">
            </tbody>
        </table>
    </div>

    <script type="module">
        let wasmModule = null;

        async function initWasm() {
            try {
                const mod = await import('./motely-wasm/dist/index.mjs');
                await mod.boot();
                wasmModule = mod;
                updateStatus('✓ WASM loaded', 'success');
            } catch (err) {
                updateStatus(`✗ Failed to load WASM: ${err.message}`, 'error');
            }
        }

        function updateStatus(message, className = '') {
            const status = document.getElementById('status');
            status.innerHTML = `<p class="${className}">${message}</p>`;
        }

        window.handleSearch = async function() {
            if (!wasmModule) {
                updateStatus('✗ WASM not loaded yet', 'error');
                return;
            }

            const jaml = document.getElementById('jaml').value.trim();
            if (!jaml) {
                updateStatus('✗ Please paste JAML first', 'error');
                return;
            }

            // Validate JAML
            const validation = wasmModule.Program.validateJaml(jaml);
            if (validation) {
                updateStatus(`✗ Invalid JAML: ${validation}`, 'error');
                return;
            }

            updateStatus('✓ JAML is valid', 'success');

            // TODO: Call actual search API when available
            // For now, show that JAML validation works
            document.getElementById('resultsTable').style.display = 'table';
            const tbody = document.getElementById('resultsBody');
            tbody.innerHTML = '<tr><td colspan="2"><em>Search API not yet implemented in WASM</em></td></tr>';
        };

        // Initialize on load
        initWasm();
    </script>
</body>
</html>
