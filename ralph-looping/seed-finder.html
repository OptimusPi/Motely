<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ralph Looping — Seed Finder</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Courier New', monospace;
            background: #0d0d12;
            color: #e0e0e0;
            padding: 20px;
            line-height: 1.6;
        }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { color: #00ff88; margin-bottom: 10px; }
        .subtitle { color: #888; margin-bottom: 20px; font-size: 14px; }
        #status {
            padding: 15px;
            background: #1a1a1f;
            border: 1px solid #333;
            margin-bottom: 20px;
            white-space: pre-wrap;
            min-height: 80px;
        }
        .error { color: #ff4444; }
        .success { color: #00ff88; }
        .info { color: #88aaff; }
        button {
            background: #00ff88; color: #0d0d12; border: none;
            padding: 12px 24px; font-weight: bold; cursor: pointer;
            font-size: 16px; font-family: inherit;
        }
        button:hover { background: #00cc6a; }
        button:disabled { background: #333; color: #666; cursor: not-allowed; }
        table {
            width: 100%; margin-top: 20px; border-collapse: collapse;
            background: #1a1a1f;
        }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #333; }
        th { background: #0d0d12; color: #00ff88; }
        tr:hover { background: #222; }
        .seed-winner { color: #ffcc00; font-weight: bold; font-size: 18px; }
        textarea {
            width: 100%; padding: 10px; margin-bottom: 15px;
            background: #1a1a1f; border: 1px solid #333; color: #e0e0e0;
            font-family: inherit; font-size: 13px; min-height: 180px; resize: vertical;
        }
        input[type="number"] {
            width: 200px; padding: 10px; margin-bottom: 15px;
            background: #1a1a1f; border: 1px solid #333; color: #e0e0e0;
            font-family: inherit; font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Ralph Looping — Seed Finder</h1>
        <p class="subtitle">NativeAOT-LLVM &bull; Bootsharp &bull; Real .NET in the browser</p>

        <textarea id="jaml" readonly></textarea>
        <label for="randomCount" style="color: #e0e0e0; display: block; margin-bottom: 5px;">Random seeds to search:</label>
        <input type="number" id="randomCount" value="1000" min="1" max="1000000">
        <button id="searchBtn" disabled>Loading WASM...</button>

        <div id="status"><span class="info">Initializing NativeAOT-LLVM runtime...</span></div>

        <table id="resultsTable" style="display:none;">
            <thead><tr><th>Seed</th><th>Score</th></tr></thead>
            <tbody id="resultsBody"></tbody>
        </table>
    </div>

    <script type="module">
        const statusEl = document.getElementById('status');
        const btnEl = document.getElementById('searchBtn');
        const jamlEl = document.getElementById('jaml');
        const tableEl = document.getElementById('resultsTable');
        const tbodyEl = document.getElementById('resultsBody');

        function log(msg, cls = '') {
            const line = document.createElement('div');
            if (cls) line.className = cls;
            line.textContent = msg;
            statusEl.appendChild(line);
            statusEl.scrollTop = statusEl.scrollHeight;
        }

        // Inline the JAML filter
        const JAML_FILTER = `name: Ralph Looping Lucky Money
author: pifreak
description: LuckyMoney in first 4 rolls, scored by HangingChad and OopsAll6s
deck: Red
stake: White

must:
  - event: LuckyMoney
    rolls: [0, 1, 2, 3]

should:
  - joker: HangingChad
    antes: [1, 2, 3, 4]
    score: 5

  - joker: OopsAll6s
    antes: [1, 2, 3, 4]
    score: 5`;

        jamlEl.value = JAML_FILTER;

        let bootsharpModule = null;
        let MotelyWasm = null;

        async function init() {
            try {
                const mod = await import('./index.mjs');
                bootsharpModule = mod.default || mod;

                log('Booting .NET NativeAOT-LLVM runtime...', 'info');
                await bootsharpModule.boot();

                // Bootsharp exports namespaced: Motely.Executors.MotelyWasm
                MotelyWasm = mod.Motely?.Executors?.MotelyWasm;
                if (!MotelyWasm) {
                    // Try flat export
                    MotelyWasm = mod.MotelyWasm;
                }
                if (!MotelyWasm) {
                    log('Available exports: ' + Object.keys(mod).join(', '), 'info');
                    throw new Error('MotelyWasm not found in exports');
                }

                log('Runtime booted.', 'success');

                // Validate JAML
                const err = MotelyWasm.validateJaml(JAML_FILTER);
                if (err) {
                    log('JAML validation error: ' + err, 'error');
                    return;
                }
                log('JAML validated OK.', 'success');

                btnEl.textContent = 'Search';
                btnEl.disabled = false;
            } catch (e) {
                log('Init failed: ' + e.message, 'error');
                console.error(e);
            }
        }

        btnEl.addEventListener('click', () => {
            if (!MotelyWasm) return;

            btnEl.disabled = true;
            btnEl.textContent = 'Searching...';
            statusEl.innerHTML = '';
            tbodyEl.innerHTML = '';
            tableEl.style.display = 'none';

            log('Starting search (1 thread, batchCharCount=3)...', 'info');

            // Subscribe to events
            MotelyWasm.onProgress.subscribe((searched, found, elapsedMs) => {
                statusEl.innerHTML = '';
                log(`Searched: ${searched} | Found: ${found} | Time: ${elapsedMs}ms`, 'info');
            });

            MotelyWasm.onResult.subscribe((seed, score) => {
                tableEl.style.display = 'table';
                const tr = document.createElement('tr');
                tr.innerHTML = `<td class="seed-winner">${seed}</td><td>${score}</td>`;
                tbodyEl.prepend(tr);
                log(`SEED FOUND: ${seed} (score: ${score})`, 'success');
            });

            // Run random search
            const randomCount = parseInt(document.getElementById('randomCount').value) || 1000;
            log(`Starting random search for ${randomCount} seeds...`, 'info');
            
            try {
                const result = MotelyWasm.runRandomSearch(JAML_FILTER, 1, randomCount);
                const [status, seedsFound, highestScore] = result.split('|');
                log(`Search complete: status=${status}, seeds=${seedsFound}, highScore=${highestScore}`, 'success');
            } catch (e) {
                log('Search error: ' + e.message, 'error');
                console.error(e);
            }

            btnEl.disabled = false;
            btnEl.textContent = 'Search Again';
        });

        init();
    </script>
</body>
</html>
