<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=375, initial-scale=1" />
    <title>jaml-ui standalone</title>
    <link rel="stylesheet" href="https://esm.sh/jaml-ui@0.26.3/jimbo.css" />
    <link rel="stylesheet" href="https://esm.sh/jaml-ui@0.26.3/fonts.css" />
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@19.2.6",
          "react-dom": "https://esm.sh/react-dom@19.2.6",
          "react-dom/client": "https://esm.sh/react-dom@19.2.6/client",
          "react/jsx-runtime": "https://esm.sh/react@19.2.6/jsx-runtime",
          "jaml-ui/ui": "https://esm.sh/jaml-ui@0.26.3/ui?external=react,react-dom"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import { createElement as h } from "react";
      import { createRoot } from "react-dom/client";
      import { JimboApp, JimboPanel, JimboText, JimboButton } from "jaml-ui/ui";

      createRoot(document.getElementById("root")).render(
        h(JimboApp, null,
          h(JimboPanel, null,
            h(JimboText, null, "hello from jaml-ui"),
            h(JimboButton, { onClick: () => alert("clicked") }, "click me")
          )
        )
      );
    </script>
  </body>
</html>
