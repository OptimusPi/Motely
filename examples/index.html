<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=375, initial-scale=1" />
    <title>jaml-ui · seed searcher</title>
    <link rel="stylesheet" href="https://esm.sh/jaml-ui@0.26.3/jimbo.css" />
    <link rel="stylesheet" href="https://esm.sh/jaml-ui@0.26.3/fonts.css" />
    <style>
      html, body { margin: 0; min-height: 100vh; background: #1a1a1a; }
      .editor {
        width: 100%; min-height: 200px; box-sizing: border-box;
        background: #0e1416; color: #e0e0e0;
        border: 2px solid #2a3a3e; border-radius: 8px;
        padding: 12px; font-family: ui-monospace, "Cascadia Code", monospace;
        font-size: 13px; line-height: 1.45; resize: vertical;
      }
      .editor:focus { outline: none; border-color: #429f79; }
      .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      .stat { display: flex; flex-direction: column; gap: 2px; min-width: 80px; }
      .stat span:first-child { font-size: 11px; opacity: 0.6; }
      .stat span:last-child { font-size: 18px; font-weight: 500; font-variant-numeric: tabular-nums; }
      .hits { max-height: 280px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; padding-right: 4px; }
      .hit { display: flex; justify-content: space-between; padding: 6px 10px; background: rgba(53, 189, 134, 0.08); border-left: 3px solid #35bd86; border-radius: 4px; font-family: ui-monospace, monospace; font-size: 13px; }
      .hit b { letter-spacing: 0.15em; color: #e4b643; }
      .hit em { font-style: normal; opacity: 0.7; }
      .err { color: #ff6b6b; font-family: ui-monospace, monospace; font-size: 12px; padding: 8px; background: rgba(255, 107, 107, 0.08); border-radius: 4px; }
    </style>
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@19.2.6",
          "react-dom": "https://esm.sh/react-dom@19.2.6",
          "react-dom/client": "https://esm.sh/react-dom@19.2.6/client",
          "react/jsx-runtime": "https://esm.sh/react@19.2.6/jsx-runtime",
          "jaml-ui/ui": "https://esm.sh/jaml-ui@0.26.3/ui?external=react,react-dom",
          "motely-wasm": "./motely-wasm/index.mjs"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import { createElement as h, useState, useEffect, useRef } from "react";
      import { createRoot } from "react-dom/client";
      import { JimboApp, JimboPanel, JimboText, JimboButton, JimboBadge, JimboSectionHeader } from "jaml-ui/ui";
      import motely, { Motely } from "motely-wasm";
      const { MotelyWasm, MotelyWasmEvents } = Motely;

      const DEFAULT_JAML = `name: blueprint copy engine
deck: Red
stake: White
must:
  - rareJoker: Blueprint
    antes: [1, 2, 3]
should:
  - rareJoker: Brainstorm
    score: 80
`;

      function App() {
        const [booted, setBooted] = useState(false);
        const [bootError, setBootError] = useState(null);
        const [jaml, setJaml] = useState(DEFAULT_JAML);
        const [budget, setBudget] = useState(10000);
        const [running, setRunning] = useState(false);
        const [searched, setSearched] = useState(0);
        const [matched, setMatched] = useState(0);
        const [hits, setHits] = useState([]);
        const [completion, setCompletion] = useState(null);
        const [error, setError] = useState(null);
        const searchRef = useRef(null);

        useEffect(() => {
          let cancelled = false;
          (async () => {
            try {
              await motely.boot();
              if (cancelled) return;
              MotelyWasmEvents.notifyResult = (seed, score) => {
                setHits(prev => [{ seed, score, t: Date.now() }, ...prev].slice(0, 100));
                setMatched(m => m + 1);
              };
              MotelyWasmEvents.notifyProgress = (n) => setSearched(n);
              MotelyWasmEvents.notifyComplete = (status, total, m) => {
                setCompletion({ status, total, matched: m });
                setRunning(false);
              };
              setBooted(true);
            } catch (e) {
              if (!cancelled) setBootError(String(e?.message ?? e));
            }
          })();
          return () => { cancelled = true; };
        }, []);

        const start = () => {
          setError(null);
          setHits([]);
          setSearched(0);
          setMatched(0);
          setCompletion(null);
          try {
            searchRef.current?.dispose?.();
            searchRef.current = MotelyWasm.startRandomSearch(jaml, Math.max(1, budget | 0));
            setRunning(true);
          } catch (e) {
            setError(String(e?.message ?? e));
          }
        };

        const cancel = () => {
          searchRef.current?.cancel?.();
          setRunning(false);
        };

        if (bootError) {
          return h(JimboApp, null,
            h(JimboPanel, null,
              h(JimboSectionHeader, null, "boot failed"),
              h("div", { className: "err" }, bootError)
            )
          );
        }

        if (!booted) {
          return h(JimboApp, null,
            h(JimboPanel, null,
              h(JimboSectionHeader, null, "booting motely-wasm"),
              h(JimboText, null, "loading the WASM engine (~11mb, first visit only)…"),
              h("div", { style: { height: 8 } }),
              h(JimboBadge, null, "single-threaded · no SharedArrayBuffer · pure ESM")
            )
          );
        }

        return h(JimboApp, null,
          h(JimboPanel, null,
            h(JimboSectionHeader, null, "seed searcher"),
            h(JimboText, null, "edit the JAML, hit start, hits stream live"),
            h("div", { style: { height: 10 } }),
            h("textarea", {
              className: "editor",
              value: jaml,
              onChange: e => setJaml(e.target.value),
              spellCheck: false,
              disabled: running
            }),
            h("div", { style: { height: 10 } }),
            h("div", { className: "row" },
              h("label", { style: { fontSize: 13, opacity: 0.7 } }, "budget"),
              h("input", {
                type: "number", min: 100, max: 1_000_000, step: 1000, value: budget,
                onChange: e => setBudget(parseInt(e.target.value, 10) || 0),
                disabled: running,
                style: { width: 110, padding: "6px 8px", background: "#0e1416", color: "#e0e0e0", border: "1px solid #2a3a3e", borderRadius: 4 }
              }),
              h(JimboButton, {
                tone: running ? "red" : "orange",
                size: "md",
                onClick: running ? cancel : start
              }, running ? "cancel" : "start"),
              h("div", { style: { flex: 1 } }),
              h("div", { className: "stat" }, h("span", null, "searched"), h("span", null, searched.toLocaleString())),
              h("div", { className: "stat" }, h("span", null, "matched"), h("span", null, matched.toLocaleString()))
            ),
            error && h("div", { className: "err", style: { marginTop: 10 } }, error),
            completion && h("div", { style: { marginTop: 10 } },
              h(JimboBadge, null, `${completion.status} · ${completion.total.toLocaleString()} searched · ${completion.matched} matched`)
            )
          ),
          hits.length > 0 && h(JimboPanel, { className: matched > 0 ? "j-glow--match" : undefined },
            h(JimboSectionHeader, null, "hits"),
            h("div", { className: "hits" },
              hits.map((hit, i) => h("div", { key: hit.seed + i, className: "hit" },
                h("b", null, hit.seed),
                h("em", null, "score " + hit.score)
              ))
            )
          )
        );
      }

      createRoot(document.getElementById("root")).render(h(App));
    </script>
  </body>
</html>
