# Publish motely-wasm to npm from this repo (Motely).
#
# One-time setup:
#   1. npm account at https://www.npmjs.com
#   2. Automation token at https://www.npmjs.com/settings/YOUR_USER/tokens
#   3. In this repo: Settings → Secrets and variables → Actions → New repository secret:
#      Name: NPM_MOTELYJAML_DEPLOY_KEY   Value: <your npm token>
#
# Publish:
#   - Option A: git tag motely-wasm-v1.0.0 && git push origin motely-wasm-v1.0.0
#   - Option B: Actions → Publish Motely WASM to npm → Run workflow (optional version override)

name: Publish Motely WASM to npm

on:
  push:
    tags:
      - 'motely-wasm-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Override version (e.g. 1.0.1). Leave empty to use package.json.'
        required: false
        type: string

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '20.x'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'

      - name: Set package version from tag
        if: startsWith(github.ref, 'refs/tags/motely-wasm-v')
        id: tag_version
        run: |
          V="${GITHUB_REF#refs/tags/motely-wasm-v}"
          echo "version=$V" >> $GITHUB_OUTPUT

      - name: Set package version (manual / override)
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        id: manual_version
        run: echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT

      - name: Build and publish to npm
        working-directory: Motely.WASM
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_MOTELYJAML_DEPLOY_KEY }}
        run: |
          if [ -n "${{ steps.tag_version.outputs.version }}" ]; then
            npm version "${{ steps.tag_version.outputs.version }}" --no-git-tag-version --allow-same-version
          fi
          if [ -n "${{ steps.manual_version.outputs.version }}" ]; then
            npm version "${{ steps.manual_version.outputs.version }}" --no-git-tag-version --allow-same-version
          fi
          npm install
          npm run build
          npm publish --access public
