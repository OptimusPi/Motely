name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: "preview"

      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Publish motely-wasm (NativeAOT-LLVM → WASM)
        run: dotnet publish Motely.BrowserWasm/Motely.BrowserWasm.csproj -c Release

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and build test site
        working-directory: Motely.TestWebsite
        run: |
          npm install
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: Motely.TestWebsite/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
