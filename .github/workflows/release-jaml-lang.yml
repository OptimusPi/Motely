name: Release jaml-lang (npm)

# Publishes jaml-lang to npm when you push a tag like `jaml-lang-v3.14.1`.
# Requires repo secret: NPM_TOKEN.
#
# Note: `npm run build` runs `gen` (regenerates from the C# engine) which is not
# available in CI, so we compile the committed src directly with tsc.
on:
  push:
    tags: ["jaml-lang-v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jaml-lang
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package.json version
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG=${GITHUB_REF_NAME#jaml-lang-v}
          echo "package.json=$PKG  tag=$TAG"
          test "$PKG" = "$TAG" || { echo "::error::tag $TAG != package.json $PKG"; exit 1; }

      - name: Build (tsc only — skip engine gen)
        run: npx tsc -p tsconfig.json

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
