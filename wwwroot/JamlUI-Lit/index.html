<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Motely Search - Lit</title>
  <link rel="stylesheet" href="style.css" />
  <script type="module" src="https://cdn.jsdelivr.net/npm/lit@3/index.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@latest/dist/browser/signalr.min.js"></script>
</head>
<body>
  <div class="app-layout">
    <div class="top-bar">
      <h1>Motely Search (Lit)</h1>
      <div class="top-bar-actions">
        <span id="connStatus" class="status-indicator" title="Disconnected">🔴</span>
      </div>
    </div>

    <div class="split-container">
      <div class="left-panel" id="leftPanel">
        <div class="panel-header">
          <span class="panel-tab panel-tab-red">JAML Filter</span>
        </div>
        <div class="panel-content">
          <textarea id="filterJaml" class="jaml-editor" placeholder="Enter your JAML filter configuration..." spellcheck="false"></textarea>

          <div class="controls-section">
            <div class="control-row">
              <label>Seed Source:</label>
              <select id="seedSource" class="control-select"></select>
            </div>
            <div class="control-row">
              <label>Max Seeds:</label>
              <input type="number" id="seedCount" class="control-input" placeholder="All" min="0" />
            </div>
          </div>

          <div class="button-row">
            <button id="startBtn" class="btn btn-primary">▶ Start</button>
            <button id="stopBtn" class="btn btn-danger" disabled>⏹ Stop</button>
          </div>

          <div id="statusBox" class="status-section" style="display:none;">
            <div class="status-row"><span class="status-label">Status:</span><span class="status-value" id="statusText">Idle</span></div>
            <div class="status-row"><span class="status-label">Progress:</span><span class="status-value" id="progressText">0%</span></div>
            <div class="status-row"><span class="status-label">Searched:</span><span class="status-value" id="searchedText">0</span></div>
            <div class="status-row"><span class="status-label">Found:</span><span class="status-value" id="foundText">0</span></div>
            <div class="status-row"><span class="status-label">Speed:</span><span class="status-value" id="speedText">-</span></div>
            <div id="errorBox" class="error-box" style="display:none;"><strong>Error:</strong> <span id="errorText"></span></div>
          </div>
        </div>
      </div>

      <div class="splitter" role="separator" aria-orientation="vertical" id="splitter">
        <div class="splitter-handle"></div>
      </div>

      <div class="right-panel" id="rightPanel">
        <div class="panel-header">
          <span class="panel-tab panel-tab-purple">Results <span class="badge" id="resultCount">0</span></span>
          <div class="panel-actions">
            <button id="clearBtn" class="btn-small" disabled>🗑️ Clear</button>
            <button id="exportBtn" class="btn-small" disabled>📥 Export</button>
          </div>
        </div>
        <div class="panel-content">
          <div id="emptyState" class="empty-state">No results yet. Start a search to see results here.</div>
          <div id="tableWrapper" class="table-wrapper" style="display:none;">
            <table class="results-table" id="resultsTable">
              <thead>
                <tr id="tableHead"></tr>
              </thead>
              <tbody id="tableBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
