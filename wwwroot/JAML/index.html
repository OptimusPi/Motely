<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>JAML – New UI</title>
  <link rel="stylesheet" href="jaml.css" />
  <link rel="stylesheet" data-name="vs/editor/editor.main" href="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/editor/editor.main.css">
</head>
<body>
  <div class="app-layout">
    <header class="jaml-header">
      <h1 class="jaml-logo">JAML</h1>
      <p class="status-inline" id="status">Initializing…</p>
    </header>

    <div class="side-by-side panel-shell">
      <div class="left-panel">
        <div class="tabs">
          <button class="tab active" onclick="switchTab('search', this)">Search</button>
          <button class="tab" onclick="switchTab('analyze', this)">Analyze</button>
        </div>

        <div id="search-tab" class="tab-content active">
          <div class="search-row">
            <select id="filtersDropdown" style="flex:1"></select>
            <select id="seedSourceDropdown" style="flex:1"></select>
            <button id="settingsBtn" title="Settings" onclick="openSettings()" class="button-small">Settings…</button>
          </div>
          <div class="editor-header">
            <label>Filter (JAML):</label>
            <div class="editor-buttons">
              <button onclick="formatJaml()" class="button-small">Format Code</button>
              <div class="editor-toggle-group">
                <button onclick="setEditorMode('monaco')" id="monacoBtn" class="toggle-btn active">Monaco Editor</button>
                <button onclick="setEditorMode('plain')" id="plainBtn" class="toggle-btn">Plain Text</button>
              </div>
            </div>
          </div>
          <div id="monacoEditor" class="monaco-container"></div>
          <textarea id="filterJaml" class="plain-editor" style="display:none"></textarea>
          <div class="action-buttons">
            <button id="searchBtn" onclick="toggleSearch()" class="button-primary">Start Search</button>
            <button onclick="saveFilter()" class="button-small">Save</button>
            <button onclick="shareLink()" class="button-small">Share</button>
          </div>
        </div>

        <div id="analyze-tab" class="tab-content">
          <div class="info-text">Click a seed in Results to analyze</div>
          <div id="analyzeContainer" class="analyze-container"></div>
        </div>
      </div>

      <div id="panelSplitter" class="panel-splitter" role="separator" aria-orientation="vertical" tabindex="0"></div>

      <div class="right-panel">
        <div class="results-header">
          <span id="resultsTitle" class="status-inline">Results</span>
          <div class="results-actions">
            <button onclick="exportCsv()" class="button-small">Export CSV</button>
            <button onclick="stopAll()" class="button-small button-danger">Stop All</button>
          </div>
        </div>
        <div id="resultsGrid" class="results-container">
          <div class="no-results">
            <p>No results yet</p>
            <p class="help-text">Start a search to see results</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal" onclick="handleBackdrop(event)">
      <div class="modal-content" onclick="event.stopPropagation()">
        <div class="modal-header">
          <h3>Settings</h3>
          <button class="close-btn" onclick="closeSettings()">&times;</button>
        </div>
        <div class="modal-body">
          <div class="builder-row">
            <label>Filter</label>
            <select id="settingsFiltersDropdown" onchange="settingsSelectFilter()"></select>
          </div>
          <div class="builder-row">
            <label>Deck</label>
            <select id="settingsDeck">
              <option value="Red">Red</option>
              <option value="Blue">Blue</option>
              <option value="Yellow">Yellow</option>
              <option value="Green">Green</option>
              <option value="Black">Black</option>
              <option value="Magic">Magic</option>
              <option value="Nebula">Nebula</option>
              <option value="Ghost">Ghost</option>
              <option value="Abandoned">Abandoned</option>
              <option value="Checkered">Checkered</option>
              <option value="Zodiac">Zodiac</option>
              <option value="Painted">Painted</option>
              <option value="Anaglyph">Anaglyph</option>
              <option value="Plasma">Plasma</option>
              <option value="Erratic">Erratic</option>
            </select>
          </div>
          <div class="builder-row">
            <label>Stake</label>
            <select id="settingsStake">
              <option value="White">White</option>
              <option value="Red">Red</option>
              <option value="Green">Green</option>
              <option value="Black">Black</option>
              <option value="Blue">Blue</option>
              <option value="Purple">Purple</option>
              <option value="Orange">Orange</option>
              <option value="Gold">Gold</option>
            </select>
          </div>
          <div class="builder-row">
            <label>Seed Source</label>
            <select id="settingsSeedSourceDropdown" onchange="settingsSeedSourceChanged()"></select>
          </div>
          <div class="builder-row">
            <label>Start Batch</label>
            <input type="number" id="batchOverride" placeholder="Auto" min="0">
          </div>
          <div class="builder-row">
            <label>Cutoff Score</label>
            <input type="number" id="cutoffOverride" placeholder="Auto" min="0">
          </div>
        </div>
        <div class="modal-footer">
          <button class="button-small" onclick="closeSettings()">Back</button>
          <button class="button-small" onclick="renameFilter()">Rename</button>
          <button class="button-small" onclick="cloneFilter()">Clone</button>
          <button class="button-small button-danger" onclick="deleteFilter()">Delete</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
  <script>
    require.config({ paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs' } });
    require(['vs/editor/editor.main'], function () {
      const container = document.getElementById('monacoEditor');
      const initialValue = document.getElementById('filterJaml')?.value || '';
      window.jamlEditor = monaco.editor.create(container, {
        value: initialValue,
        language: 'yaml',
        automaticLayout: true,
        theme: 'vs-dark',
        minimap: { enabled: false },
        fontSize: 14,
        lineNumbers: 'on',
      });
      window.jamlEditor.addCommand(monaco.KeyMod.Shift | monaco.KeyCode.Tab, () => {
        window.jamlEditor.trigger('keyboard', 'editor.action.outdentLines');
      });
      window.jamlEditor.onDidChangeModelContent(() => {
        document.getElementById('filterJaml').value = window.jamlEditor.getValue();
      });
      if (typeof window.onMonacoReady === 'function') window.onMonacoReady();
    });
  </script>
  <script src="jaml.js"></script>
</body>
</html>
