<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAML Modular UI</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <header class="header">
            <h1>JAML Editor</h1>
            <div class="controls">
                <button id="add-panel">Add Panel</button>
                <button id="reset-layout">Reset Layout</button>
            </div>
        </header>
        
        <main class="workspace">
            <div class="panels-container" id="panels">
                <!-- Panels will be dynamically added here -->
            </div>
        </main>
        
        <footer class="status-bar">
            <span id="status">Ready</span>
            <span id="panel-count">0 panels</span>
        </footer>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
