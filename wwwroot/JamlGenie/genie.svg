<svg width="420" height="420" viewBox="0 0 420 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="genieBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6a1b9a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8e24aa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ab47bc;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="genieHeadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f4c430;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#eaba44;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lampGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4cc9f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06d6a0;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#f4c430;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#f4c430;stop-opacity:0" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background glow -->
  <circle cx="210" cy="210" r="200" fill="url(#glowGrad)" opacity="0.3"/>
  
  <!-- Genie body (swirling smoke) -->
  <path d="M 180 320 Q 160 280, 150 240 Q 140 200, 145 160 Q 150 120, 170 100 Q 190 80, 210 85 Q 230 90, 245 110 Q 260 130, 265 160 Q 270 190, 260 220 Q 250 250, 230 280 Q 210 310, 180 320 Z" 
        fill="url(#genieBodyGrad)" opacity="0.9"/>
  <path d="M 200 320 Q 180 290, 175 250 Q 170 210, 180 170 Q 190 130, 210 120 Q 230 110, 250 130 Q 270 150, 275 180 Q 280 210, 270 240 Q 260 270, 240 300 Q 220 320, 200 320 Z" 
        fill="url(#genieBodyGrad)" opacity="0.7"/>
  
  <!-- Genie head -->
  <ellipse cx="210" cy="140" rx="60" ry="70" fill="url(#genieHeadGrad)"/>
  
  <!-- Genie face -->
  <!-- Eyes -->
  <ellipse cx="195" cy="130" rx="8" ry="12" fill="#1a1a2e"/>
  <ellipse cx="225" cy="130" rx="8" ry="12" fill="#1a1a2e"/>
  <ellipse cx="197" cy="128" rx="4" ry="6" fill="#4cc9f0"/>
  <ellipse cx="227" cy="128" rx="4" ry="6" fill="#4cc9f0"/>
  
  <!-- Nose -->
  <ellipse cx="210" cy="145" rx="4" ry="6" fill="#eaba44"/>
  
  <!-- Smile -->
  <path d="M 195 155 Q 210 165, 225 155" stroke="#1a1a2e" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Beard/chin -->
  <path d="M 190 160 Q 200 180, 210 175 Q 220 180, 230 160" 
        fill="url(#genieHeadGrad)" opacity="0.8"/>
  
  <!-- Turban/head wrap -->
  <ellipse cx="210" cy="100" rx="55" ry="25" fill="#6a1b9a"/>
  <ellipse cx="210" cy="95" rx="50" ry="20" fill="#8e24aa"/>
  <circle cx="230" cy="95" r="8" fill="#f4c430"/>
  
  <!-- Arms -->
  <ellipse cx="160" cy="200" rx="25" ry="40" fill="url(#genieBodyGrad)" opacity="0.8" transform="rotate(-30 160 200)"/>
  <ellipse cx="260" cy="200" rx="25" ry="40" fill="url(#genieBodyGrad)" opacity="0.8" transform="rotate(30 260 200)"/>
  
  <!-- Hands holding lamp -->
  <ellipse cx="145" cy="230" rx="12" ry="15" fill="url(#genieHeadGrad)"/>
  <ellipse cx="275" cy="230" rx="12" ry="15" fill="url(#genieHeadGrad)"/>
  
  <!-- Magic lamp -->
  <rect x="200" y="240" width="20" height="40" rx="3" fill="url(#lampGrad)"/>
  <rect x="202" y="242" width="16" height="35" rx="2" fill="#06d6a0" opacity="0.5"/>
  <ellipse cx="210" cy="240" rx="12" ry="4" fill="#4cc9f0"/>
  <ellipse cx="210" cy="280" rx="10" ry="3" fill="#06d6a0"/>
  
  <!-- Lamp spout -->
  <path d="M 210 240 Q 215 235, 220 240" stroke="#4cc9f0" stroke-width="2" fill="none"/>
  
  <!-- Magic sparkles -->
  <circle cx="150" cy="120" r="3" fill="#f4c430" filter="url(#glow)" opacity="0.9">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="270" cy="120" r="3" fill="#4cc9f0" filter="url(#glow)" opacity="0.9">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="180" cy="180" r="2" fill="#06d6a0" filter="url(#glow)" opacity="0.9">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="240" cy="180" r="2" fill="#f4c430" filter="url(#glow)" opacity="0.9">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Magic smoke from lamp -->
  <path d="M 210 240 Q 205 220, 200 200 Q 195 180, 200 160" 
        stroke="#4cc9f0" stroke-width="3" fill="none" opacity="0.6" stroke-linecap="round">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="3s" repeatCount="indefinite"/>
  </path>
  <path d="M 210 240 Q 215 220, 220 200 Q 225 180, 220 160" 
        stroke="#06d6a0" stroke-width="3" fill="none" opacity="0.6" stroke-linecap="round">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="3.5s" repeatCount="indefinite"/>
  </path>
</svg>


