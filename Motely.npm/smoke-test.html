<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Motely WASM 1.3.0 Smoke Test</title>
    <style>
        :root {
            /* Jimbo Colors - Strictly matched to user request */
            --jimbo-red: #ff4c40;
            --jimbo-blue: #0093ff;
            --jimbo-gold: #ff9800;
            --jimbo-green: #429f79;

            /* Backgrounds and Neutrals from globals.css */
            --jimbo-bg: #0f1419;
            --jimbo-card: #1a2332;
            --jimbo-text: #f6f0d5;
            --jimbo-border: #334461;
            --jimbo-shadow: rgba(0, 0, 0, 0.5);
        }

        body {
            font-family: monospace;
            background-color: var(--jimbo-bg);
            color: var(--jimbo-text);
            margin: 0;
            padding: 2rem;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .crt-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 100;
        }

        .container {
            background-color: var(--jimbo-card);
            border: 4px solid var(--jimbo-border);
            border-radius: 12px;
            padding: 2rem;
            width: 100%;
            max-width: 800px;
            box-shadow: 0 10px 0 var(--jimbo-shadow);
            position: relative;
            z-index: 1;
        }

        h1 {
            color: var(--jimbo-gold);
            text-align: center;
            font-size: 3rem;
            margin-top: 0;
            text-shadow: 2px 2px 0 #000;
        }

        p {
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 2rem;
        }

        .controls {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-bottom: 2rem;
        }

        button {
            font-family: 'm6x11plus', monospace;
            font-size: 1.5rem;
            padding: 0.75rem 2rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.1s;
            position: relative;
            box-shadow: 0 4px 0 var(--jimbo-shadow);
        }

        button:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        #startBtn {
            background-color: var(--jimbo-blue);
            color: white;
        }

        #startBtn:hover:not(:disabled) {
            background-color: #007acc;
        }

        #stopBtn {
            background-color: var(--jimbo-red);
            color: white;
        }

        #stopBtn:hover:not(:disabled) {
            background-color: #d32f2f;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            background-color: rgba(0, 0, 0, 0.2);
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
        }

        .stat {
            font-size: 1.25rem;
        }

        .stat span {
            font-weight: bold;
        }

        #status span.running {
            color: var(--jimbo-green);
        }

        #status span.idle {
            color: #888;
        }

        #status span.done {
            color: var(--jimbo-blue);
        }

        pre {
            background: #1a1a1a;
            color: #ccc;
            padding: 1rem;
            border-radius: 4px;
            height: 200px;
            overflow-y: auto;
            border: 2px solid #555;
            font-size: 1rem;
        }

        /* Scrollbar styles */
        pre::-webkit-scrollbar {
            width: 8px;
        }

        pre::-webkit-scrollbar-track {
            background: #1a1a1a;
        }

        pre::-webkit-scrollbar-thumb {
            background: #555;
            border-radius: 4px;
        }
    </style>
</head>

<body>
    <div class="crt-overlay"></div>
    <div class="container">
        <h1>Motely WASM 1.3.0</h1>
        <p>Smoke Test Protocol: <span style="color:var(--jimbo-gold)">INITIATED</span></p>

        <div class="controls">
            <button id="startBtn">▶ START SEARCH</button>
            <button id="stopBtn" disabled>⏹ STOP</button>
        </div>

        <div class="dashboard">
            <div class="stat" id="status">STATUS: <span class="idle">IDLE</span></div>
            <div class="stat" id="progress">PROGRESS: <span>0%</span></div>
            <div class="stat" id="results" style="grid-column: span 2; text-align: center;">RESULTS: <span
                    style="color:var(--jimbo-gold)">0 FOUND</span></div>
        </div>

        <pre id="log">Waiting for command...</pre>
    </div>

    <script type="module">
        import { loadMotely } from './index.js';

        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const logEl = document.getElementById('log');
        const progressEl = document.querySelector('#progress span');
        const resultsEl = document.querySelector('#results span');
        const statusEl = document.querySelector('#status span');

        let api = null;
        let resultCount = 0;

        function log(msg) {
            logEl.textContent += `\n[${new Date().toLocaleTimeString()}] ${msg}`;
            logEl.scrollTop = logEl.scrollHeight;
        }

        function finish() {
            startBtn.disabled = false;
            stopBtn.disabled = true;
            statusEl.textContent = "DONE";
            statusEl.className = "done";
        }

        log("Loading WASM runtime...");
        loadMotely({ baseUrl: './_framework' }).then(loaded => {
            api = loaded;
            const v = api.getVersion();
            const c = api.getCapabilities();
            log(`WASM loaded: v${v.version} | SIMD=${c.simd} | Threads=${c.threads} | CPUs=${c.processorCount}`);
            startBtn.disabled = false;
        }).catch(e => {
            log(`LOAD FAILED: ${e.message}`);
        });

        startBtn.onclick = async () => {
            if (!api) { log("Not loaded yet."); return; }
            log("STARTING SEARCH...");
            startBtn.disabled = true;
            stopBtn.disabled = false;
            statusEl.textContent = "RUNNING";
            statusEl.className = "running";
            resultCount = 0;
            resultsEl.textContent = "0 FOUND";
            progressEl.textContent = "0%";

            const jaml = `
name: Smoke Test
deck: Red
stake: White
must:
  - voucher: Overstock
`;

            try {
                const result = await api.startJamlSearch(jaml, {
                    threadCount: 2,
                    endBatchIndex: 50,
                    onProgress: (msg) => {
                        log(`PROGRESS: ${msg}`);
                    },
                    onResult: (seed) => {
                        resultCount++;
                        resultsEl.textContent = `${resultCount} FOUND`;
                        log(`HIT: ${seed}`);
                    }
                });
                log(`DONE: ${JSON.stringify(result)}`);
                finish();
            } catch (e) {
                log(`SEARCH FAILED: ${e.message}`);
                finish();
            }
        };

        stopBtn.onclick = () => {
            if (api) api.stopSearch();
            log("STOPPED");
            finish();
        };
    </script>
</body>

</html>
