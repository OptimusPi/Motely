<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>motely-wasm smoke</title>
</head>
<body>
  <pre id="out">booting…</pre>
  <script type="module">
    // Smoke harness: exercises every export and stamps the verdict into document.title so a
    // headless browser can assert on it. Registered before main.mjs runs, so the ready event
    // can't be missed.
    const out = document.getElementById("out");
    const fail = (e) => {
      document.title = "MOTELY-WASM-FAIL";
      out.textContent = "FAIL: " + (e?.stack ?? e);
    };
    addEventListener("error", (e) => fail(e.error ?? e.message));
    addEventListener("motely-ready", async () => {
      try {
        const m = globalThis.motely;
        const good =
          "name: smoke\ndeck: Ghost\nstake: Gold\nmust:\n  - joker: Blueprint\n    antes: [1]\n";
        const bad = "name: smoke\nmust:\n  - jokr: Blueprint\n";
        const shouldOnly =
          "name: smoke\ndeck: Red\nstake: White\nshould:\n  - joker: Joker\n    antes: [1, 2]\n    score: 5\n";

        const r = {};
        r.version = m.Version();
        r.vocab = JSON.parse(m.Vocabulary());
        r.parseOk = JSON.parse(m.ParseJaml(good));
        r.parseBad = JSON.parse(m.ParseJaml(bad));
        r.diags = JSON.parse(m.Diagnostics(bad));
        r.complete = JSON.parse(m.Complete("must:\n  - jok", 1, 7)).length;
        r.score = JSON.parse(
          await m.ScoreSeeds(shouldOnly, ["AAAAAAAA", "ALEEB111", "IGLOO111", "WVPK7LB2"])
        );

        const checks = {
          version: r.version.length > 0,
          vocab: r.vocab.jokers.length >= 140 && r.vocab.decks.length >= 15 && r.vocab.tags.length >= 20,
          parseOk: r.parseOk.ok === true && r.parseOk.deck === "Ghost" && r.parseOk.must === 1,
          parseBad: r.parseBad.ok === false && typeof r.parseBad.error === "string",
          diags: r.diags.length === 1 && r.diags[0].code.startsWith("JAML"),
          score: r.score.ok === true && r.score.results.length === 4,
        };
        r.checks = checks;
        out.textContent = JSON.stringify(r, null, 2);
        document.title = Object.values(checks).every(Boolean)
          ? "MOTELY-WASM-OK"
          : "MOTELY-WASM-FAIL";
      } catch (e) {
        fail(e);
      }
    });
  </script>
  <script type="module" src="./main.mjs"></script>
</body>
</html>
