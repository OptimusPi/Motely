<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>motely-wasm smoke</title>
</head>
<body>
  <pre id="out">booting…</pre>
  <script type="module">
    // Smoke harness: exercises every export against the real Bootsharp contract and stamps
    // the verdict into document.title so a headless browser can assert on it. Registered
    // before main.mjs runs, so the ready event can't be missed.
    //
    // Serve the REPO ROOT (tests/smoke.mjs does) so the Whimsy filter is fetchable — the
    // flagship check is the board's own done-criterion: parse Whimsy, score TPZZOLBB, 245.
    const out = document.getElementById("out");
    const big = (_, v) =>
      typeof v === "bigint" ? v.toString()
      : v instanceof Map ? Object.fromEntries(v)
      : v instanceof Int32Array ? [...v]
      : v;
    const fail = (e) => {
      document.title = "MOTELY-WASM-FAIL";
      out.textContent = "FAIL: " + (e?.stack ?? e);
    };
    addEventListener("error", (e) => fail(e.error ?? e.message));
    addEventListener("motely-ready", async () => {
      try {
        const m = globalThis.motely;
        const good =
          "name: smoke\ndeck: Ghost\nstake: Gold\nmust:\n  - joker: Blueprint\n    antes: [1]\n";
        const bad = "name: smoke\nmust:\n  - jokr: Blueprint\n";
        const whimsy = await fetch("/JamlFilters/Whimsy_Dicetricks.jaml").then((r) =>
          r.ok ? r.text() : Promise.reject(new Error("Whimsy filter not served — serve the repo root")));

        const r = {};
        r.version = m.version();
        const vocab = m.vocabulary(); // ES6 Map, from generated JamlSchema
        r.vocabKinds = [...vocab.keys()].length;
        r.discriminators = m.discriminators();
        r.parseOk = m.parseJaml(good);
        r.parseBad = m.parseJaml(bad);
        r.diags = m.diagnostics(bad);
        r.completeCount = m.complete("must:\n  - jok", 1, 7).length;
        r.whimsyParse = m.parseJaml(whimsy);
        r.score = await m.scoreSeeds(whimsy, ["TPZZOLBB", "MB8GJDBB", "OP3ZOBBB", "3VDISOUP"]);

        const scoreOf = (seed) => r.score.results.find((x) => x.seed === seed)?.score;
        const checks = {
          version: r.version.startsWith("25."),
          vocabMap: vocab instanceof Map && r.vocabKinds >= 20,
          vocabJokers: (vocab.get("joker")?.length ?? 0) >= 140,
          vocabDecks: (vocab.get("Deck")?.length ?? 0) >= 15,
          vocabTags: (vocab.get("bigBlindTag")?.length ?? 0) >= 20,
          eventClauses: r.discriminators.includes("luckyMoney"),
          parseOk: r.parseOk.ok === true && r.parseOk.deck === "Ghost" && r.parseOk.must === 1,
          parseBad: r.parseBad.ok === false && typeof r.parseBad.error === "string",
          diags: r.diags.length === 1 && r.diags[0].code.startsWith("JAML"),
          complete: r.completeCount > 0,
          whimsyParse: r.whimsyParse.ok === true && r.whimsyParse.deck === "Anaglyph",
          whimsyScore:
            r.score.ok === true &&
            scoreOf("TPZZOLBB") === 245 &&
            scoreOf("MB8GJDBB") === 227 &&
            scoreOf("OP3ZOBBB") === 206 &&
            scoreOf("3VDISOUP") === 129,
        };
        r.checks = checks;
        out.textContent = JSON.stringify(r, big, 2);
        document.title = Object.values(checks).every(Boolean)
          ? "MOTELY-WASM-OK"
          : "MOTELY-WASM-FAIL";
      } catch (e) {
        fail(e);
      }
    });
  </script>
  <script type="module" src="./main.mjs"></script>
</body>
</html>
