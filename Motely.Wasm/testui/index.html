<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>motely-wasm — test UI</title>
<!-- testui is a zero-dependency static server (serve.mjs), no bundler — bare specifiers
     need an explicit import map or the browser can't resolve them. -->
<script type="importmap">
{
  "imports": {
    "@rewaffle/bootsharp-file-system": "/node_modules/@rewaffle/bootsharp-file-system/index.js"
  }
}
</script>
<style>
  :root { --ink: #1d2733; --soft: #5a6b7d; --line: #d8dee6; --go: #1e7a3c; --bad: #b3261e; }
  * { box-sizing: border-box; }
  body { margin: 0 auto; max-width: 900px; padding: 1.5rem 1rem 3rem;
         font-family: system-ui, "Segoe UI", sans-serif; color: var(--ink); line-height: 1.5; }
  h1 { font-size: 1.5rem; margin: 0 0 0.25rem; }
  #status { font-size: 0.95rem; color: var(--soft); }
  #status.booted { color: var(--go); font-weight: 600; }
  #editor { border: 1px solid var(--line); border-radius: 8px; margin-top: 1rem; }
  #editor .cm-editor { border-radius: 8px; }
  #editor .cm-content { font: 0.9rem/1.5 ui-monospace, Consolas, monospace; min-height: 180px; }
  .row { display: flex; gap: 0.6rem; margin-top: 0.75rem; flex-wrap: wrap; align-items: center; }
  button { font: inherit; font-weight: 600; padding: 0.5rem 1.1rem; border: none;
           border-radius: 8px; background: var(--ink); color: #fff; cursor: pointer; }
  button:disabled { opacity: 0.45; cursor: wait; }
  #validation { font: 0.9rem ui-monospace, Consolas, monospace; }
  #validation.ok { color: var(--go); }
  #validation.error { color: var(--bad); white-space: pre-wrap; }
  #progress { color: var(--soft); font-size: 0.95rem; min-height: 1.4em; margin-top: 0.75rem; }
  table { border-collapse: collapse; width: 100%; margin-top: 0.75rem; }
  th, td { text-align: left; padding: 0.4rem 0.75rem; border-bottom: 1px solid var(--line);
           font: 0.9rem ui-monospace, Consolas, monospace; }
  th { color: var(--soft); font-family: inherit; font-weight: 600; }
</style>
</head>
<body>

<h1>motely-wasm</h1>
<p id="status">booting…</p>

<div id="editor"></div>

<div class="row">
  <button id="search" disabled>Search</button>
  <span id="validation"></span>
</div>

<div class="row">
  <button id="mount" disabled>Mount folder…</button>
  <input id="filename" placeholder="filter-name" style="font:0.9rem ui-monospace,Consolas,monospace;padding:0.4rem 0.6rem;border:1px solid var(--line);border-radius:6px" disabled>
  <button id="save" disabled>Save .jaml</button>
  <button id="load" disabled>Load .jaml</button>
  <span id="fsStatus" style="color:var(--soft);font-size:0.9rem"></span>
</div>

<p id="progress"></p>

<table>
  <thead><tr><th>Seed</th><th>Score</th><th>Tallies</th></tr></thead>
  <tbody id="results"></tbody>
</table>

<script type="module">
  import bootsharp, * as Motely from "/dist/index.mjs";
  import * as fs from "@rewaffle/bootsharp-file-system";
  const { MotelyWasm, MotelyJaml, MotelySearch, IFileMounter, MotelyFileSystem } = Motely;
  Object.assign(globalThis, Motely);

  // Must run before boot() — wires the browser's File System Access API to the
  // IFileMounter interop Bootsharp.FileSystem auto-injects into C# (see
  // D:\bootsharp\docs\guide\extensions\file-system.md). IFileMounter is the raw
  // extension-provided binding; MotelyFileSystem (MotelyFileSystem.cs) is this
  // project's own feature built on top of it — pick a folder once, then
  // save/load/delete .jaml files directly on disk.
  fs.init(IFileMounter);
  import { EditorView, basicSetup } from "https://esm.sh/codemirror@6.0.1";
  import { yaml } from "https://esm.sh/@codemirror/lang-yaml@6.1.2";
  import { autocompletion } from "https://esm.sh/@codemirror/autocomplete@6.18.4";
  import { linter, lintGutter } from "https://esm.sh/@codemirror/lint@6.8.4";

  const $ = (id) => document.getElementById(id);

  // Subscribe events before boot — the bridge forms at boot().
  MotelySearch.onProgress.subscribe((p) => {
    $("progress").textContent = `searched ${p.seedsSearched} · matches ${p.matchingSeeds}`;
  });

  await bootsharp.boot();

  // ---- vocabulary-driven completion: values come from the engine's own enums ----
  const VALUE_KINDS = {
    joker: "joker", jokers: "joker", commonJoker: "joker", uncommonJoker: "joker",
    rareJoker: "joker", legendaryJoker: "joker",
    voucher: "voucher", boss: "boss", tag: "tag", smallBlindTag: "tag", bigBlindTag: "tag",
    deck: "deck", stake: "stake", edition: "edition", seal: "seal",
    tarotCard: "tarot", spectralCard: "spectral", planetCard: "planet",
  };
  const KEYS = [
    "name", "deck", "stake", "seeds", "must", "should", "mustNot",
    "joker", "legendaryJoker", "voucher", "tarotCard", "spectralCard", "planetCard",
    "standardCard", "boss", "tag", "smallBlindTag", "bigBlindTag",
    "antes", "score", "min", "max", "edition", "sources", "and", "or",
  ];

  function jamlComplete(context) {
    const line = context.state.doc.lineAt(context.pos);
    const before = line.text.slice(0, context.pos - line.from);

    // value position: "  - joker: luckyc"
    const valueMatch = before.match(/([A-Za-z]+):\s*([A-Za-z]*)$/);
    if (valueMatch && VALUE_KINDS[valueMatch[1]]) {
      const partial = valueMatch[2];
      const names = MotelyJaml.listItems(VALUE_KINDS[valueMatch[1]], partial || null);
      return {
        from: context.pos - partial.length,
        options: names.map((label) => ({ label, type: "constant" })),
      };
    }

    // key position: start of a mapping entry
    const keyMatch = before.match(/(?:^|-\s+)([A-Za-z]*)$/);
    if (keyMatch && (context.explicit || keyMatch[1].length > 0)) {
      return {
        from: context.pos - keyMatch[1].length,
        options: KEYS.map((label) => ({ label: label + ": ", type: "property", displayLabel: label })),
      };
    }
    return null;
  }

  // ---- live lint: engine validation + vocabulary check, zero buttons ----
  function jamlLint(view) {
    const text = view.state.doc.toString();
    const diagnostics = [];

    const error = MotelyJaml.validate(text);
    const out = $("validation");
    if (error) {
      diagnostics.push({ from: 0, to: view.state.doc.line(1).to, severity: "error", message: error });
      out.textContent = error;
      out.className = "error";
    } else {
      out.textContent = "valid ✓";
      out.className = "ok";
    }

    // Value typos validate structurally but never match — catch them against the vocabulary.
    for (let n = 1; n <= view.state.doc.lines; n++) {
      const line = view.state.doc.line(n);
      const m = line.text.match(/^\s*-?\s*([A-Za-z]+):\s*([A-Za-z]+)\s*$/);
      if (!m || !VALUE_KINDS[m[1]] || m[2] === "Any") continue;
      const kind = VALUE_KINDS[m[1]];
      const exact = MotelyJaml.listItems(kind, m[2]).some((x) => x.toLowerCase() === m[2].toLowerCase());
      if (!exact) {
        const near = MotelyJaml.listItems(kind, m[2].slice(0, 4))[0];
        const at = line.from + line.text.indexOf(m[2], m[0].indexOf(":"));
        diagnostics.push({
          from: at, to: at + m[2].length, severity: "error",
          message: `Unknown ${kind} "${m[2]}"${near ? ` — did you mean ${near}?` : ""}`,
        });
      }
    }
    return diagnostics;
  }

  const view = new EditorView({
    doc: `name: testui
deck: Red
stake: White
seeds: [AAAAAAAA, BBBBBBBB]
should:
  - joker: Any
    score: 1
`,
    parent: $("editor"),
    extensions: [
      basicSetup,
      yaml(),
      autocompletion({ override: [jamlComplete], activateOnTyping: true }),
      lintGutter(),
      linter(jamlLint, { delay: 300 }),
    ],
  });

  $("status").textContent = `booted · motely ${MotelyWasm.getVersion()}`;
  $("status").classList.add("booted");
  $("search").disabled = false;
  $("mount").disabled = false;

  MotelyFileSystem.onChange.subscribe((text) => {
    $("fsStatus").textContent = `changed: ${text}`;
  });

  $("mount").addEventListener("click", async () => {
    $("mount").disabled = true;
    $("fsStatus").textContent = "picking folder…";
    const mounted = await MotelyFileSystem.pickAndMountFolder();
    $("mount").disabled = false;
    if (!mounted) { $("fsStatus").textContent = "cancelled"; return; }
    $("fsStatus").textContent = "folder mounted";
    $("filename").disabled = false;
    $("save").disabled = false;
    $("load").disabled = false;
  });

  $("save").addEventListener("click", async () => {
    const name = $("filename").value.trim();
    if (!name) { $("fsStatus").textContent = "enter a filename first"; return; }
    await MotelyFileSystem.saveJamlFilter(name, view.state.doc.toString());
    $("fsStatus").textContent = `saved ${name}.jaml`;
  });

  $("load").addEventListener("click", async () => {
    const name = $("filename").value.trim();
    if (!name) { $("fsStatus").textContent = "enter a filename first"; return; }
    try {
      const jaml = await MotelyFileSystem.loadJamlFilter(name);
      view.dispatch({ changes: { from: 0, to: view.state.doc.length, insert: jaml } });
      $("fsStatus").textContent = `loaded ${name}.jaml`;
    } catch (e) {
      $("fsStatus").textContent = `load failed: ${e.message ?? e}`;
    }
  });

  // Test hooks: Playwright (and curious humans) drive the page through these.
  globalThis.__motely = {
    setDoc: (text) => view.dispatch({ changes: { from: 0, to: view.state.doc.length, insert: text } }),
    getDoc: () => view.state.doc.toString(),
  };

  $("search").addEventListener("click", async () => {
    $("search").disabled = true;
    $("results").replaceChildren();
    try {
      const config = MotelyJaml.fromJaml(view.state.doc.toString());
      const results = await MotelySearch.searchList(config);
      for (const r of results) {
        const tr = document.createElement("tr");
        for (const text of [r.seed, String(r.score), Array.from(r.tallies ?? []).join(" ")]) {
          const td = document.createElement("td");
          td.textContent = text;
          tr.appendChild(td);
        }
        $("results").appendChild(tr);
      }
    } catch (e) {
      const out = $("validation");
      out.textContent = String(e?.message ?? e);
      out.className = "error";
    } finally {
      $("search").disabled = false;
    }
  });
</script>

</body>
</html>
