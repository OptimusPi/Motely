<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>seed finder — a motely-wasm consumer</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#1d2733">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SeedFinder">
<style>
  :root { --ink: #1d2733; --soft: #5a6b7d; --line: #d8dee6; --go: #1e7a3c; --bad: #b3261e; }
  * { box-sizing: border-box; }
  body { margin: 0 auto; max-width: 900px; padding: 1.5rem 1rem 3rem;
         font-family: system-ui, "Segoe UI", sans-serif; color: var(--ink); line-height: 1.5; }
  h1 { font-size: 1.5rem; margin: 0 0 0.25rem; }
  #status { font-size: 0.95rem; color: var(--soft); }
  #status.booted { color: var(--go); font-weight: 600; }
  label { display: block; margin-top: 1rem; color: var(--soft); font-size: 0.9rem; }
  .editor { border: 1px solid var(--line); border-radius: 8px; margin-top: 0.35rem; }
  .editor .cm-editor { border-radius: 8px; }
  .editor .cm-content { font: 0.9rem/1.5 ui-monospace, Consolas, monospace; }
  #jaml .cm-content { min-height: 160px; }
  .row { display: flex; gap: 0.6rem; margin-top: 0.85rem; flex-wrap: wrap; align-items: center; }
  /* Touch-first: 48px minimum target, generous padding — phone thumbs and neuropathic
     hands get the same easy hit. No animations anywhere on this page by design (HPPD-calm). */
  button { font: inherit; font-weight: 600; padding: 0.75rem 1.5rem; min-height: 48px;
           border: none; border-radius: 8px; background: var(--ink); color: #fff; cursor: pointer; }
  button:disabled { opacity: 0.45; cursor: wait; }
  @media (max-width: 600px) {
    body { font-size: 1.05rem; padding: 1rem 0.75rem 3rem; }
    button { width: 100%; }
    th, td { padding: 0.6rem 0.5rem; }
  }
  #validation { font: 0.9rem ui-monospace, Consolas, monospace; }
  #validation.ok { color: var(--go); }
  #validation.error { color: var(--bad); white-space: pre-wrap; }
  #progress { color: var(--soft); font-size: 0.95rem; min-height: 1.4em; margin-top: 0.75rem; }
  table { border-collapse: collapse; width: 100%; margin-top: 0.75rem; }
  th, td { text-align: left; padding: 0.4rem 0.75rem; border-bottom: 1px solid var(--line);
           font: 0.9rem ui-monospace, Consolas, monospace; }
  th { color: var(--soft); font-family: inherit; font-weight: 600; }
</style>
</head>
<body>

<h1>seed finder</h1>
<p id="status">booting…</p>

<label for="jaml">JAML filter — live lint and completion come from the engine's own vocabulary</label>
<div class="editor" id="jaml"></div>

<div class="row">
  <button id="search" disabled>Search</button>
  <span id="validation"></span>
</div>

<p id="progress"></p>

<table>
  <thead><tr><th>Seed</th><th>Score</th><th>Tallies</th></tr></thead>
  <tbody id="results"></tbody>
</table>

<script>
  // Installable app: the service worker makes the shell + engine open instantly and offline.
  if ("serviceWorker" in navigator)
    navigator.serviceWorker.register("sw.js");
</script>
<script type="module">
  // motely-wasm exactly as npm installs it. serve.mjs maps /motely/ -> node_modules/motely-wasm/dist/.
  import bootsharp, * as Motely from "/motely/index.mjs";
  const { MotelyWasm, MotelyJaml, MotelyLsp, MotelySearch } = Motely;
  Object.assign(globalThis, Motely);

  import { EditorView, basicSetup } from "https://esm.sh/codemirror@6.0.1";
  import { yaml } from "https://esm.sh/@codemirror/lang-yaml@6.1.2";
  import { autocompletion } from "https://esm.sh/@codemirror/autocomplete@6.18.4";
  import { linter, lintGutter } from "https://esm.sh/@codemirror/lint@6.8.4";

  // The same editor binding testui uses — serve.mjs maps /shared/ to ../shared.
  import { jamlEditorExtensions } from "/shared/jaml-editor.mjs";

  const $ = (id) => document.getElementById(id);

  // Subscribe to events BEFORE boot() — the bridge forms at boot.
  let searched = 0n;
  MotelySearch.onProgress.subscribe((p) => {
    searched = p.seedsSearched;
    $("progress").textContent = `searched ${p.seedsSearched} · matches ${p.matchingSeeds}`;
  });
  MotelySearch.onScoredResult.subscribe(addRow);

  // Embedded build: the boot resources travel inside the module, so boot() takes no argument.
  await bootsharp.boot();

  const setStatus = (text, kind) => {
    const out = $("validation");
    out.textContent = text;
    out.className = kind === "ok" ? "ok" : "error";
  };

  const jamlView = new EditorView({
    doc: `name: consumer
deck: Red
stake: White
`,
    parent: $("jaml"),
    extensions: [
      basicSetup, yaml(),
      // Diagnostics and completion come from MotelyLsp — the engine's own language service.
      ...jamlEditorExtensions({
        lsp: MotelyLsp,
        autocompletion,
        linter,
        lintGutter,
        onStatus: setStatus,
        delay: 300,
      }),
    ],
  });

  function addRow(r) {
    const tr = document.createElement("tr");
    for (const text of [r.seed, String(r.score), Array.from(r.tallies ?? []).join(" ")]) {
      const td = document.createElement("td");
      td.textContent = text;
      tr.appendChild(td);
    }
    $("results").appendChild(tr);
  }

  $("status").textContent = `booted · motely ${MotelyWasm.getVersion()}`;
  $("status").classList.add("booted");
  $("search").disabled = false;

  // Test hooks: Playwright drives the page through these, same as a human drives the editors.
  globalThis.__app = {
    setJaml: (t) => jamlView.dispatch({ changes: { from: 0, to: jamlView.state.doc.length, insert: t } }),
    seedsSearched: () => searched,
  };

  $("search").addEventListener("click", async () => {
    $("search").disabled = true;
    $("results").replaceChildren();
    $("progress").textContent = "searching…";
    try {
      const config = MotelyJaml.fromJaml(jamlView.state.doc.toString());
      // A real find: walk fresh seeds. searchList only re-scores the `seeds:` block.
      await MotelySearch.searchRandom(config, 20000);
      $("progress").textContent = `done · searched ${searched} · ${$("results").childElementCount} shown`;
    } catch (e) {
      const out = $("validation");
      out.textContent = String(e?.message ?? e);
      out.className = "error";
      $("progress").textContent = "failed";
    } finally {
      $("search").disabled = false;
      document.body.dataset.searchDone = "1";
    }
  });
</script>

</body>
</html>
