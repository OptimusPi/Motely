<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>motely-wasm browser smoke</title>
</head>
<body>
<h1 id="status">Booting...</h1>
<p id="hint" style="font: 13px monospace; color: #666;">
  Boot path is host-chosen. Override via <code>?bin=/your/path</code>.
  Default <code>/motely-wasm/bin</code> works when this dir is served as the static root.
</p>
<pre id="log"></pre>
<script type="module">
import bootsharp, { Motely } from "../motely-wasm/dist/index.mjs";

const status = document.getElementById("status");
const log = document.getElementById("log");
const write = (s) => { log.textContent += s + "\n"; console.log(s); };

// Boot URL is host-chosen (Motely.Wasm/README.md "Booting"). Don't hardcode.
const binUrl = new URLSearchParams(location.search).get("bin") ?? "/motely-wasm/bin";

const SAMPLE_JAML = `
name: SmokeTest
deck: Erratic
stake: Black
must:
  - joker: WeeJoker
    antes: [1]
`;

const tests = {
  testValidateJaml_ValidInput_ReturnsValid() {
    const r = Motely.validateJaml(SAMPLE_JAML);
    if (r !== "valid") throw new Error(`expected 'valid', got ${JSON.stringify(r)}`);
  },
  testValidateJaml_GarbageInput_ReturnsErrorString() {
    const r = Motely.validateJaml("not yaml at all !@#");
    if (r === "valid") throw new Error("expected error string, got 'valid'");
  },
  testExplainJaml_ReturnsNonEmptyString() {
    const r = Motely.explainJaml(SAMPLE_JAML);
    if (typeof r !== "string" || r.length === 0) throw new Error("empty");
  },
  testCreatePlan_ReturnsObject() {
    const p = Motely.createPlan(SAMPLE_JAML);
    if (!p || typeof p !== "object") throw new Error(`got ${typeof p}`);
  },
  testPublicApiSurface_DocumentedMembersPresent() {
    const required = ["validateJaml", "explainJaml", "createPlan", "analyzeJamlSeeds",
                      "createSearch", "version", "onSeedMatch", "onScoredResult", "onProgress"];
    const missing = required.filter((name) => !(name in Motely));
    if (missing.length > 0) throw new Error("missing: " + missing.join(", "));
  },
};

let passed = 0, failed = 0;

try {
  write("import ok");
  await bootsharp.boot(binUrl);
  write(`boot ok (from ${binUrl})`);
} catch (e) {
  status.textContent = `RESULT: FAIL — boot from ${binUrl}: ${e?.message ?? e}`;
  status.style.color = "red";
  write("BOOT ERROR: " + (e?.stack ?? e));
  throw e;
}

for (const [name, test] of Object.entries(tests)) {
  try { test(); write("pass: " + name); passed++; }
  catch (e) { write("fail: " + name + " — " + (e?.message ?? e)); failed++; }
}

write(`\n${passed}/${passed + failed} passed`);
if (failed === 0) { status.textContent = "RESULT: PASS"; status.style.color = "green"; }
else { status.textContent = `RESULT: FAIL — ${failed} failed`; status.style.color = "red"; }
</script>
</body>
</html>
